name: Padel Saturday Sniper (Monday 10-13 Lisbon)

on:
  schedule:
    # Start five minutes early so browser setup finishes before the 10:00 window.
    - cron: '55 9 * * 1'
      timezone: Europe/Lisbon
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only check, or live monitoring (live only runs inside the Monday window)'
        type: choice
        required: true
        default: check
        options:
          - check
          - live

concurrency:
  group: padel-sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 205
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p \"require('./package-lock.json').packages['node_modules/playwright'].version\")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run sniper
        env:
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode || 'check' }}
          STORAGE_STATE_B64: ${{ secrets.STORAGE_STATE_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROUP_URL: https://racket.id/groups/4Y4qCwClTWQPAM
          POLL_INTERVAL_MS: '1000'
          RELOAD_INTERVAL_MS: '15000'
          MAX_RUNTIME_MS: '11700000'
          HEADLESS: 'true'
        run: node snipe.mjs

      - name: Upload diagnostic screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniper-diagnostics
          path: |
            joined.png
            unverified.png
            result.json
          if-no-files-found: ignore
          retention-days: 7
